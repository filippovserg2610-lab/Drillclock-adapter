<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Би(о)'графия DrillClock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px 14px 30px;
            display: flex;
            justify-content: center;

            background-image: url('fon.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #0b0e1a;
        }

        /* Псевдоэлемент для размытия фона */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background-image: url('fon.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            filter: blur(12px); /* СРЕДНЕЕ РАЗМЫТИЕ */
            transform: scale(1.05);
        }

        .container {
            max-width: 480px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f7e9b0;
            text-shadow: 0 0 12px #fbbf24, 0 0 25px rgba(251, 191, 36, 0.15), 0 4px 20px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            line-height: 1.3;
        }

        .header h1 span {
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none;
        }

        .header .sub {
            color: #d0d8f0;
            font-size: 0.9rem;
            margin-top: 6px;
            background: rgba(0, 0, 0, 0.6);
            display: inline-block;
            padding: 4px 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 100, 0.1);
        }

        .greeting-box {
            background: rgba(13, 17, 28, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 215, 100, 0.08);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .greeting-box p {
            color: #e8edf5;
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .greeting-box .highlight {
            color: #fbbf24;
            font-weight: 600;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .menu-btn {
            background: rgba(30, 39, 64, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 100, 0.15);
            border-radius: 18px;
            padding: 18px 8px;
            text-align: center;
            color: #e8edf5;
            font-size: 1.0rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.1s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
            word-break: break-word;
            line-height: 1.3;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .menu-btn:nth-child(1) { background: rgba(42, 31, 61, 0.85); border-color: #a855f7; color: #e9d5ff; }
        .menu-btn:nth-child(2) { background: rgba(30, 58, 47, 0.85); border-color: #34d399; color: #d1fae5; }
        .menu-btn:nth-child(3) { background: rgba(45, 55, 72, 0.85); border-color: #60a5fa; color: #dbeafe; }
        .menu-btn:nth-child(4) { background: rgba(59, 31, 42, 0.85); border-color: #f472b6; color: #fce7f3; }
        .menu-btn:nth-child(5) { background: rgba(45, 42, 30, 0.85); border-color: #fbbf24; color: #fef3c7; }
        .menu-btn:nth-child(6) { background: rgba(31, 42, 58, 0.85); border-color: #818cf8; color: #e0e7ff; }

        .menu-btn:active {
            transform: scale(0.94);
            opacity: 0.8;
        }

        .wide-btn {
            grid-column: 1 / -1;
            background: rgba(45, 31, 58, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 2px solid #c084fc;
            border-radius: 18px;
            padding: 18px 12px;
            text-align: center;
            color: #f3e8ff;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.25);
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: block;
            letter-spacing: 2px;
            transition: transform 0.1s;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .wide-btn:active {
            transform: scale(0.95);
        }

        .footer-note {
            text-align: center;
            color: #c8d0e8;
            font-size: 0.7rem;
            margin-top: 20px;
            opacity: 0.8;
            border-top: 1px solid rgba(255,215,100,0.06);
            padding-top: 16px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        @media (max-width: 400px) {
            .menu-btn { font-size: 0.85rem; padding: 14px 6px; min-height: 60px; }
            .wide-btn { font-size: 1.0rem; padding: 14px 8px; }
            .header h1 { font-size: 1.3rem; }
            .greeting-box p { font-size: 0.85rem; }
        }

        @media (max-width: 360px) {
            .menu-grid { gap: 8px; }
            .menu-btn { font-size: 0.75rem; padding: 10px 4px; min-height: 50px; border-radius: 14px; }
            .wide-btn { font-size: 0.9rem; padding: 12px 6px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>Би(о)'графия / ВлОг <br><span>DrillClock Man Titanic</span></h1>
            <div class="sub">⚡ переходник DrillClock ⚡</div>
        </div>

        <div class="greeting-box">
            <p>
                Всех приветствую, вы попали в <span class="highlight">биографию / переходник DrillClock</span><br>
                Выберите интересующую кнопку ниже
            </p>
        </div>

        <div class="menu-grid">
            <a href="#" class="menu-btn">Мои проекты</a>
            <a href="#" class="menu-btn">Мои отзывы</a>
            <a href="#" class="menu-btn">Мои друзья</a>
            <a href="#" class="menu-btn">личка</a>
            <a href="#" class="menu-btn">Мои достижения в играх</a>
            <a href="#" class="menu-btn">сохранения</a>
        </div>

        <a href="#" class="wide-btn">Акрагемикс</a>

        <div class="footer-note">
            Би(о)'графия/ВлОг DrillClock Man Titanic
        </div>

    </div>
</body>
</html>
