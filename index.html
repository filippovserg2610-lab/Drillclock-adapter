<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>DrillClock</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ——— ЧЁРНЫЙ ЭКРАН И ПОЛОСКИ ——— */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column;
            transition: opacity 1s ease, visibility 1s ease;
        }
        #loader.hide {
            opacity: 0; visibility: hidden;
        }

        .stripes {
            display: flex; gap: 8px; justify-content: center; align-items: center;
            height: 60px;
        }
        .stripe {
            width: 6px; height: 100%; background: #fff;
            border-radius: 4px;
            animation: stripeGrow 1.2s ease-in-out infinite alternate;
        }
        .stripe:nth-child(1) { animation-delay: 0.0s; }
        .stripe:nth-child(2) { animation-delay: 0.1s; }
        .stripe:nth-child(3) { animation-delay: 0.2s; }
        .stripe:nth-child(4) { animation-delay: 0.3s; }
        .stripe:nth-child(5) { animation-delay: 0.4s; }
        .stripe:nth-child(6) { animation-delay: 0.5s; }
        .stripe:nth-child(7) { animation-delay: 0.6s; }
        .stripe:nth-child(8) { animation-delay: 0.7s; }
        .stripe:nth-child(9) { animation-delay: 0.8s; }
        .stripe:nth-child(10) { animation-delay: 0.9s; }
        .stripe:nth-child(11) { animation-delay: 1.0s; }
        .stripe:nth-child(12) { animation-delay: 1.1s; }

        @keyframes stripeGrow {
            0% { transform: scaleY(0.3); opacity: 0.3; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* ——— ОСНОВНОЙ КОНТЕНТ С АНИМАЦИЕЙ ПОЯВЛЕНИЯ ——— */
        body {
            min-height: 100vh; min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; padding: 12px;
            background-image: url('fon.webp');
            background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
            background-color: #0b0e1a;
            margin: 0;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background-image: url('fon.webp');
            background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
            filter: blur(12px); transform: scale(1.05);
        }

        .card {
            max-width: 480px; width: 100%;
            background: rgba(13, 17, 28, 0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            border-radius: 40px 40px 32px 32px; padding: 24px 20px 32px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 100, 0.15);
            border: 1px solid rgba(255, 215, 100, 0.1); text-align: center;
            opacity: 0;
            animation: fadeInZoom 1s ease forwards;
            animation-delay: 1.8s;
        }

        @keyframes fadeInZoom {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .image-wrapper {
            background: rgba(0, 0, 0, 0.4); border-radius: 28px; padding: 12px 12px 8px;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.7), 0 8px 20px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 215, 100, 0.15); margin-bottom: 32px;
        }
        .image-wrapper img { display: block; width: 100%; height: auto; border-radius: 18px; background: #0b0f1a; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); }
        .btn-start {
            display: inline-block; background: linear-gradient(165deg, #fbbf24, #f59e0b);
            border: none; padding: 18px 20px; width: 100%; max-width: 320px; border-radius: 60px;
            font-size: 2.2rem; font-weight: 800; letter-spacing: 4px; color: #0d111c;
            text-transform: uppercase; text-decoration: none;
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.4), 0 0 0 2px rgba(255, 215, 100, 0.2);
            border: 1px solid #ffdd77; text-shadow: 0 1px 2px rgba(255,255,200,0.4);
            cursor: pointer; transition: transform 0.1s; touch-action: manipulation; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-start:active { transform: scale(0.94); }
        @media (max-width: 440px) {
            .card { padding: 18px 14px 24px; border-radius: 32px 32px 24px 24px; }
            .btn-start { font-size: 1.9rem; padding: 16px 12px; max-width: 100%; }
            .image-wrapper { padding: 8px; }
        }
        @media (max-width: 360px) { .btn-start { font-size: 1.6rem; padding: 14px 8px; } }
    </style>
</head>
<body>

    <!-- ЧЁРНЫЙ ЭКРАН С ПОЛОСКАМИ -->
    <div id="loader">
        <div class="stripes">
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="perehodnik.webp" alt="DrillClock" loading="lazy" decoding="async" />
        </div>
        <a href="menu.html" class="btn-start" role="button">Старт</a>
    </div>

    <script>
        // Скрываем чёрный экран через 2 секунды
        setTimeout(() => {
            document.getElementById('loader').classList.add('hide');
        }, 2000);
    </script>
</body>
</html>
